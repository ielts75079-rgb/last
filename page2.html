<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Crucial for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="transition-overlay" id="overlay"></div>

  <!-- Background Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <h2>Moments With You ✨</h2>

  <div class="gallery-container">
    <div class="floating-photo">
      <img src="https://raw.githubusercontent.com/ielts75079-rgb/last/ebdcb9a3fc7b8bf649f9132b1cf700af973d57dc/ricksha.jpeg" alt="Memory 1">
      <p>ME+RICKSHAW+YOU </p>
    </div>
    <div class="floating-photo">
<img src="https://raw.githubusercontent.com/ielts75079-rgb/last/ebdcb9a3fc7b8bf649f9132b1cf700af973d57dc/garden.jpeg" alt="Memory 2">
      <p>YOU+GARDEN+ME </p>
    </div>
    <div class="floating-photo">
      <img src="https://raw.githubusercontent.com/ielts75079-rgb/last/ea0c92c9ac290677074c7beebab41fc2eac738a7/restu.jpeg" alt="Memory 3">
      <p>FOOD+U+ME </p>
    </div>
  </div>

  <button class="nav-btn" onclick="navigateTo('page3.html')">JUMP TO scratch ✨</button>

  <script>
    function navigateTo(url) {
      document.getElementById('overlay').classList.add('active');
      setTimeout(() => { window.location.href = url; }, 800);
    }
  </script>
</body>
</html>
