<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Friendship Voucher - Page 6</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #fef6f9;
      overflow-x: hidden;
      position: relative;
      padding: 15px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .page-content {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      font-size: 1.3rem;
      color: #ff4757;
      margin-bottom: 20px;
    }

    .voucher-card {
      background: #ffffff;
      border: 3px dashed #ff4757;
      border-radius: 18px;
      padding: 22px 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      position: relative;
    }

    .voucher-card h3 {
      color: #ff4757;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .voucher-card p {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.5;
    }

    .redeem-btn {
      background-color: #2ed573;
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .redeem-btn:hover {
      background-color: #26af5f;
    }

    .nav-btn {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 12px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="transition-overlay" id="overlay"></div>

  <div class="page-content">
    <h2>Claim Your Special Voucher 🎟️</h2>
    
    <div class="voucher-card" id="voucher">
      <h3>✨ ULTIMATE BESTIE VOUCHER ✨</h3>
      <p>This coupon entitles the bearer to <strong>unlimited free food treats</strong>, mandatory listening to gossip, and a lifelong partner to blame things on.</p>
      <button class="nav-btn redeem-btn" id="claimBtn" onclick="claimVoucher()">Claim Voucher 🎉</button>
    </div>

    <button class="nav-btn" onclick="navigateTo('page7.html')">Final Grand Finale 🌟</button>
  </div>

  <script>
    function claimVoucher() {
      const btn = document.getElementById('claimBtn');
      btn.innerText = "CLAIMED! ✅ (Successfully Saved)";
      btn.style.backgroundColor = "#ffa502";
      btn.disabled = true;
    }

    function navigateTo(url) {
      document.getElementById('overlay').classList.add('active');
      setTimeout(() => { window.location.href = url; }, 800);
    }
  </script>
</body>
</html>
